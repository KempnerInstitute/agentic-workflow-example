name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv has no major-version tag
      # The cpu extra installs the CPU builds of PyTorch. The tests use generated images.
      - run: uv sync --locked --extra cpu
      - run: .venv/bin/python -m pytest -q
