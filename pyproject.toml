[project]
name = "pruning-example"
version = "0.1.0"
description = "End-to-end agentic workflow example: a Claude Code agent prunes ResNet-18 on CIFAR-10 on the Kempner AI cluster."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kempner Institute, Harvard University" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
# Choose one extra: cpu for CI and laptops, gpu for the cluster.
cpu = ["torch>=2.8", "torchvision>=0.23"]
gpu = ["torch>=2.8", "torchvision>=0.23"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pruning_example"]

[tool.uv]
required-version = ">=0.8.19"
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

# The CUDA 13.0 builds need NVIDIA driver 580 or later. The cluster GPUs have driver 610.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
